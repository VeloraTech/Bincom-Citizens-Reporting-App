name: Build Android APK

on:
  push:
    branches: [main, 'milestone-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Install dependencies
        run: npm ci

      - name: Run source checks
        run: npm run check

      - name: Add Cordova Android platform
        run: npx cordova platform add android --no-save

      - name: Verify Cordova Android requirements
        run: npx cordova requirements android

      - name: Build debug APK
        run: npm run build:android

      - name: Upload APK and web bundle
        uses: actions/upload-artifact@v4
        with:
          name: citizen-reporting-android-debug
          path: |
            platforms/android/app/build/outputs/apk/debug/app-debug.apk
            www/
            config.xml
          if-no-files-found: error
          retention-days: 7
