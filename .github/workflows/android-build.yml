name: Build Android APK
on:
  push:
    branches: ['milestone-*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-34
            platforms;android-35
            build-tools;35.0.0
      - name: Install dependencies
        run: npm ci
      - name: Configure public Supabase runtime settings
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLIC_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const supabaseUrl = (process.env.SUPABASE_URL || '').trim();
          const publicKey = (process.env.SUPABASE_PUBLIC_KEY || '').trim();
          const missing = [];
          if (!supabaseUrl) missing.push('SUPABASE_URL');
          if (!publicKey) missing.push('SUPABASE_PUBLISHABLE_KEY or SUPABASE_ANON_KEY');
          if (missing.length) { console.error(`Missing required configuration: ${missing.join(' and ')}.`); process.exit(1); }
          let parsedUrl;
          try { parsedUrl = new URL(supabaseUrl); } catch { console.error('SUPABASE_URL must be a valid HTTPS URL.'); process.exit(1); }
          if (parsedUrl.protocol !== 'https:' || !parsedUrl.hostname || parsedUrl.username || parsedUrl.password || parsedUrl.search || parsedUrl.hash) { console.error('SUPABASE_URL must be a valid HTTPS URL.'); process.exit(1); }
          if (/^sb_secret_/i.test(publicKey)) { console.error('A Supabase secret key cannot be used as public app configuration.'); process.exit(1); }
          const publishable = /^sb_publishable_[A-Za-z0-9_-]+$/i.test(publicKey);
          const jwt = /^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(publicKey);
          let anon = false;
          if (jwt) { try { anon = JSON.parse(Buffer.from(publicKey.split('.')[1], 'base64url').toString()).role === 'anon'; } catch {} }
          if (!publishable && !anon) { console.error('Configure only a public publishable or anon key.'); process.exit(1); }
          fs.writeFileSync('www/env.js', `window.BINCOM_CONFIG = ${JSON.stringify({supabaseUrl, supabaseAnonKey: publicKey}, null, 2)};\n`, {mode: 0o600});
          fs.chmodSync('www/env.js', 0o600);
          console.log('Generated ignored www/env.js; values were not logged.');
          NODE
      - name: Run source checks
        run: npm run check
      - name: Verify Cordova Android requirements
        run: npx cordova requirements android
      - name: Build debug APK
        run: npm run build:android
      - name: Upload APK and web bundle
        uses: actions/upload-artifact@v4
        with:
          name: citizen-reporting-android-debug
          path: |
            platforms/android/app/build/outputs/apk/debug/app-debug.apk
            www/
            config.xml
          if-no-files-found: error
          retention-days: 7
